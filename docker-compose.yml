services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: repoint-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set a strong local SQL Server SA password in .env}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - repoint-sql-data:/var/opt/mssql
volumes:
  repoint-sql-data:
